services:
  - type: web
    name: measurement-sheet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL   # paste your free Neon/Supabase Postgres URL here
        sync: false
